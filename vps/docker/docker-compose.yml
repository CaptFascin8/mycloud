# MyCloud VPS service stack — runs alongside the system-level Nginx
# that already serves crystaldragon.tech and hopeandgrace.space on this box.
#
# This compose stack provides ONLY the IPFS Kubo node. System Nginx
# proxies /ipfs/* requests on srv825251.hstgr.cloud to localhost:9601.
# See /etc/nginx/sites-enabled/srv825251.hstgr.cloud.
#
# Ports per docs/PORTS.md; MyCloud owns the 96xx block.
#   docker compose up -d ipfs

services:
  ipfs:
    image:          ipfs/kubo:latest
    container_name: mycloud-ipfs
    restart:        unless-stopped
    environment:
      IPFS_PROFILE: server
      IPFS_PATH:    /data/ipfs
    volumes:
      - ./data/ipfs-staging:/export
      - ./data/ipfs:/data/ipfs
    ports:
      # 4001 = libp2p swarm. Public so peers can dial in.
      - "4001:4001/tcp"
      - "4001:4001/udp"
      # 9600 -> 5001 = RPC API. LOCALHOST ONLY. Treat as root-equivalent.
      - "127.0.0.1:9600:5001"
      # 9601 -> 8080 = HTTP gateway. LOCALHOST ONLY; system Nginx proxies it.
      - "127.0.0.1:9601:8080"
    healthcheck:
      test:     ["CMD", "ipfs", "id"]
      interval: 30s
      timeout:  10s
      retries:  3
