# NOTE: This file is REFERENCE ONLY. It was scaffolded for a Docker
# Nginx, but the actual deployed Nginx is the system-level one at
# /etc/nginx/sites-enabled/srv825251.hstgr.cloud (which we wrote
# by hand). System Nginx is shared with crystaldragon.tech and
# hopeandgrace, so we don't run a Docker Nginx on this VPS.
#
# Keeping this file because the proxy_pass and ACME challenge patterns
# below are the right shape — useful if MyCloud ever moves to its
# own dedicated VPS.

# MyCloud Nginx — replace HTTP-only block with a TLS server after certbot.

server {
    listen      80;
    server_name srv825251.hstgr.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ ^/(ipfs|ipns)/ {
        proxy_pass         http://ipfs:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root  /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
